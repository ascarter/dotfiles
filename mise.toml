# This repository config installs itself as the global mise config. The
# canonical checkout path keeps its sources valid before and after that link
# exists. Dotfiles are applied only by explicit bootstrap operations.
min_version = "2026.7.4"

[settings]
dotfiles.root = "~/Developer/dotfiles"
dotfiles.default_mode = "symlink"
idiomatic_version_file_enable_tools = ["rust"]
python.uv_venv_auto = "source"

# Keep the global baseline deliberately small. rv provides the Ruby manager,
# and stable Rust provides a fallback; projects select their own toolchains.
[tools]
"aqua:spinel-coop/rv" = "latest"
delta = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
neovim = "latest"
ripgrep = "latest"
rust = "stable"
tree-sitter = "latest"
usage = "latest"

[bootstrap.repos]
"~/Developer/dotfiles" = { url = "https://github.com/ascarter/dotfiles.git", ref = "main" }

# Keep the XDG config directory open to unmanaged and application-owned files.
# The mise config and tasks are explicit entries because this file owns them.
[dotfiles]
"~/.config" = { source = "config", mode = "symlink-each" }
"~/.config/mise/config.toml" = "mise.toml"

[dotfiles."~/.zshenv/xdg"]
comment = "#"
block = '''
export XDG_BIN_HOME="${XDG_BIN_HOME:-$HOME/.local/bin}"
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
export ZDOTDIR="${ZDOTDIR:-$XDG_CONFIG_HOME/zsh}"
export DOTFILES_HOME="${DOTFILES_HOME:-${HOME}/Developer/dotfiles}"

# Rustup owns Rust toolchains even when mise selects them. Keep its shared
# toolchains and Cargo state beneath the XDG data directory.
export RUSTUP_HOME="${RUSTUP_HOME:-$XDG_DATA_HOME/rustup}"
export CARGO_HOME="${CARGO_HOME:-$XDG_DATA_HOME/cargo}"

typeset -U path PATH
path=("$XDG_BIN_HOME" $path)
'''

[bootstrap.user]
login_shell = "/bin/zsh"

[tasks.bootstrap]
description = "Reconcile the user environment"
depends_post = ["bootstrap:git", "bootstrap:git-lfs"]

[tasks."bootstrap:git"]
description = "Configure Git settings"
usage = '''
arg "[name]" help="Git user.name"
arg "[email]" help="Git user.email"
'''
env.GITCONFIG_FILE = "${HOME}/.gitconfig"
run = [
  'gh auth status --active || gh auth login --git-protocol=https --web --clipboard',
  'git config unset --file ${GITCONFIG_FILE} user.name || true',
  'git config unset --file ${GITCONFIG_FILE} user.email || true',
  'git config set --file ${GITCONFIG_FILE} user.name "${usage_name:-$(gh api user --jq .name)}"',
  'git config set --file ${GITCONFIG_FILE} user.email "${usage_email:-$(gh api user --jq .login)@users.noreply.github.com}"',
  'gh auth setup-git --hostname github.com'
]
quiet = true

[tasks."bootstrap:git-lfs"]
description = "Configure Git LFS"
run = 'git lfs install --skip-repo'
depends = ["bootstrap:git"]
quiet = true

[tasks."bootstrap:gcm"]
description = "Configure Git Credential Manager for Azure DevOps"
run = 'git-credential-manager configure'
depends = ["bootstrap:git"]
quiet = true

# macOS defaults
[bootstrap.macos.dock]
autohide = true
show_recents = true

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
preferred_view_style = "column"

[bootstrap.macos.keyboard]
press_and_hold = false

[bootstrap.macos.defaults]
"com.apple.finder" = { AppleShowAllFiles = true }
"com.apple.terminal" = { FocusFollowsMouse = true }
"NSGlobalDomain" = { "NSMenuEnableActionImages" = false }
