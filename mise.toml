# Dotfile sources are staged here, but nothing is applied implicitly.
# `mise dotfiles apply` and `mise bootstrap` are explicit mutating operations.
min_version = "2026.7.4"

[settings]
dotfiles.default_mode = "symlink"

# Keep the XDG config directory open to unmanaged and application-owned files.
# Each source file is linked individually rather than replacing ~/.config.
[dotfiles]
"~/.config" = { source = "src/config", mode = "symlink-each" }

[dotfiles."~/.zshenv/xdg"]
comment = "#"
block = '''
export XDG_BIN_HOME="${XDG_BIN_HOME:-$HOME/.local/bin}"
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
export ZDOTDIR="${ZDOTDIR:-$XDG_CONFIG_HOME/zsh}"

typeset -U path PATH
path=("$XDG_BIN_HOME" $path)
'''

[tasks.status]
description = "Report migration and live-configuration status without changing the system"
run = "./scripts/dotfiles-status"

[tasks.doctor]
description = "Run read-only repository, migration, and host readiness diagnostics"
run = "./scripts/dotfiles-doctor"

# Intentionally absent during the initial migration:
# - [tools] language managers and runtimes
# - [bootstrap.packages]
# - [tasks.bootstrap]
