# This repository config installs itself as the global mise config. The
# canonical checkout path keeps its sources valid before and after that link
# exists. Dotfiles are applied only by explicit bootstrap operations.
min_version = "2026.7.4"

[settings]
dotfiles.default_mode = "symlink"
idiomatic_version_file_enable_tools = ["rust"]
python.uv_venv_auto = "source"

# Keep the global baseline deliberately small. rv provides the Ruby manager,
# and stable Rust provides a fallback; projects select their own toolchains.
[tools]
"aqua:spinel-coop/rv" = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
neovim = "latest"
rust = "stable"
tree-sitter = "latest"
usage = "latest"

# Keep the XDG config directory open to unmanaged and application-owned files.
# The mise config and tasks are explicit entries because this file owns them.
[dotfiles]
"~/.config" = { source = "~/Developer/dotfiles/config", mode = "symlink-each" }
"~/.config/mise/config.toml" = { source = "~/Developer/dotfiles/mise.toml", mode = "symlink" }
"~/.config/mise/tasks" = { source = "~/Developer/dotfiles/mise/tasks", mode = "symlink-each" }

[dotfiles."~/.zshenv/xdg"]
comment = "#"
block = '''
export XDG_BIN_HOME="${XDG_BIN_HOME:-$HOME/.local/bin}"
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
export ZDOTDIR="${ZDOTDIR:-$XDG_CONFIG_HOME/zsh}"

# Rustup owns Rust toolchains even when mise selects them. Keep its shared
# toolchains and Cargo state beneath the XDG data directory.
export RUSTUP_HOME="${RUSTUP_HOME:-$XDG_DATA_HOME/rustup}"
export CARGO_HOME="${CARGO_HOME:-$XDG_DATA_HOME/cargo}"

typeset -U path PATH
path=("$XDG_BIN_HOME" $path)
'''

[bootstrap.user]
login_shell = "/bin/zsh"

[tasks.bootstrap]
description = "Reconcile the user environment"
run = [{ task = "bootstrap-git" }]
