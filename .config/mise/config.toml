[settings]
idiomatic_version_file_enable_tools = ["rust"]
python.uv_venv_auto = "source"

[bootstrap.user]
login_shell = "/bin/zsh"

[bootstrap.mise_shell_activate]
bash = true
zsh = true

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/ascarter/dotfiles.git", ref = "main" }

[dotfiles]
"~/.config" = { source = "~/.dotfiles/.config", mode = "symlink-each" }

[dotfiles."~/.zshenv/xdg"]
comment = "#"
block = '''
export XDG_BIN_HOME="${XDG_BIN_HOME:-$HOME/.local/bin}"
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
export ZDOTDIR="${ZDOTDIR:-$XDG_CONFIG_HOME/zsh}"
export DOTFILES_HOME="${DOTFILES_HOME:-${HOME}/.dotfiles}"

typeset -U path PATH
path=("$XDG_BIN_HOME" $path)
'''

[shell_alias]
dotfiles-cd = 'cd "${DOTFILES_HOME}"'
dotfiles-update = 'mise -C "${DOTFILES_HOME}" bootstrap --update'
dotfiles-edit = '$EDITOR "${DOTFILES_HOME}"'
mdf = 'mise -C "${DOTFILES_HOME}"'
mr = 'mise run'
dircolors = 'coreutils dircolors'
ls = 'coreutils ls --group-directories-first --color=auto --human-readable'
la = 'ls -a -l'
ll = 'ls -l'
'l.' = 'ls -d .*'
htop = 'btm --basic'
sshpw = 'ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no'
dev = 'cd ${HOME}/Developer'
nvcurl = 'edcurl -e nvim'
zcurl = 'edcurl -e zed'

[tools]
"aqua:spinel-coop/rv" = "latest"
bottom = "latest"
coreutils = "latest"
delta = "latest"
fastfetch = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
herdr = "latest"
neovim = "latest"
ripgrep = "latest"
rust = "latest"
tree-sitter = "latest"
usage = "latest"

[tasks."bootstrap:workstation"]
description = "Bootstrap workstation applications"
depends = [
  "bootstrap:git",
  "bootstrap:git-lfs",
  "bootstrap:install:claude",
  "bootstrap:install:codex",
  "bootstrap:install:copilot",
  "bootstrap:install:zed",
]

[tasks."bootstrap:git"]
usage = '''
arg "[name]" help="Git user.name"
arg "[email]" help="Git user.email"
'''
env = { GITCONFIG_FILE = "${GITCONFIG_FILE:-$HOME/.gitconfig}" }
description = "Configure Git settings"
run = [
  'gh auth status --active || gh auth login --git-protocol=https',
  'git config set --file ${GITCONFIG_FILE} user.name "${usage_name:-$(gh api user --jq .name)}"',
  'git config set --file ${GITCONFIG_FILE} user.email "${usage_email:-$(gh api user --jq .login)@users.noreply.github.com}"',
  'gh auth setup-git --hostname github.com',
]

[tasks."bootstrap:git-lfs"]
description = "Configure Git LFS"
depends = ["bootstrap:git"]
run = 'git lfs install --skip-repo'

[tasks."bootstrap:gcm"]
description = "Configure Git Credential Manager for Azure DevOps"
depends = ["bootstrap:git"]
run = 'git-credential-manager configure'

[tasks."bootstrap:install:claude"]
description = "Install Claude Code CLI"
run = 'command -v claude >/dev/null 2>&1 && claude update || curl -fsSL https://claude.ai/install.sh | bash'

[tasks."bootstrap:install:codex"]
description = "Install Codex CLI"
run = 'curl -fsSL https://chatgpt.com/codex/install.sh | sh'

[tasks."bootstrap:install:copilot"]
description = "Install GitHub Copilot CLI"
run = 'command -v copilot >/dev/null 2>&1 && copilot update || curl -fsSL https://gh.io/copilot-install | bash'

[tasks."bootstrap:install:zed"]
description = "Install Zed"
run = 'command -v zed >/dev/null 2>&1 || curl -fsSL https://zed.dev/install.sh | sh'
