[settings]
idiomatic_version_file_enable_tools = ["rust"]
python.uv_venv_auto = "source"

[bootstrap.mise_shell_activate]
bash = true

[tasks."bootstrap:workstation"]
description = "Enable and bootstrap the workstation profile"
run = [
  'mise -E workstation bootstrap dotfiles apply "~/.miserc.toml/workstation"',
  "mise bootstrap",
]

[bootstrap.repos]
"~/.dotfiles" = { url = "https://github.com/ascarter/dotfiles.git", ref = "main" }

[dotfiles]
"~/.config" = { source = "~/.dotfiles/.config", mode = "symlink-each" }

[dotfiles."~/.zshenv/xdg"]
comment = "#"
block = '''
export XDG_BIN_HOME="${XDG_BIN_HOME:-$HOME/.local/bin}"
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
export XDG_DATA_HOME="${XDG_DATA_HOME:-$HOME/.local/share}"
export XDG_STATE_HOME="${XDG_STATE_HOME:-$HOME/.local/state}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
export ZDOTDIR="${ZDOTDIR:-$XDG_CONFIG_HOME/zsh}"
export DOTFILES_HOME="${DOTFILES_HOME:-${HOME}/.dotfiles}"

typeset -U path PATH
path=("$XDG_BIN_HOME" $path)
'''
