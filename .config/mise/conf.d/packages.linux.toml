[bootstrap.packages]
"dnf:git" = "latest"
"dnf:zsh" = "latest"
"apt:git" = "latest"
"apt:zsh" = "latest"
"pacman:git" = "latest"
"pacman:zsh" = "latest"
"apk:git" = "latest"
"apk:zsh" = "latest"

[bootstrap.hooks.post-packages]
run = ["mise run bootstrap:rpm:overlay"]

[tasks."bootstrap:rpm:overlay"]
description = "Install base RPM overlays"
run = [{ task = "bootstrap:rpm:install", args = ["zsh"] }]
