[tasks."bootstrap:rpm:repos"]
description = "Configure Fedora package repositories"
run = [
  { task = "bootstrap:rpm:repo-add", args = [
    "https://pkgs.tailscale.com/stable/fedora/tailscale.repo",
  ] },
  { task = "bootstrap:rpm:repo-add", args = [
    "https://packages.microsoft.com/yumrepos/vscode/config.repo",
    "vscode.repo",
  ] },
]

[tasks."bootstrap:flatpak:repos"]
description = "Configure Flatpak repositories"
run = [
  { task = "bootstrap:flatpak:remote-add", args = [
    "https://flathub.org/repo/flathub.flatpakrepo",
  ] },
  { task = "bootstrap:flatpak:remote-add", args = [
    "https://apt.pop-os.org/cosmic/cosmic.flatpakrepo",
  ] },
]

[tasks."bootstrap:rpm:overlay:workstation"]
description = "Install workstation RPM overlays"
run = [
  { task = "bootstrap:rpm:install", args = [
    "zsh",
    "bolt",
    "solaar",
    "steam-devices",
    "cosmic-monitor",
  ] },
  { task = "bootstrap:rpm:install", args = [
    "chatgpt",
    "--url",
    "https://persistent.oaistatic.com/codex-app-prod/linux/rpm/latest/chatgpt.{{ arch(x64=\"x86_64\", arm64=\"aarch64\") }}.rpm",
  ] },
]

[bootstrap.hooks.pre-packages]
run = ["mise run bootstrap:rpm:repos", "mise run bootstrap:flatpak:repos"]

[bootstrap.hooks.post-packages]
run = [
  "mise run bootstrap:rpm:overlay:workstation",
  "mise run bootstrap:fix-openai-rpm",
]

[bootstrap.packages]
"dnf:zsh" = { version = "latest", os = "linux" }
"apt:zsh" = { version = "latest", os = "linux" }
"pacman:zsh" = { version = "latest", os = "linux" }
"apk:zsh" = { version = "latest", os = "linux" }
"brew-cask:bbedit" = { os = "macos" }
"brew-cask:chatgpt" = { os = "macos" }
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:github-copilot-app" = { os = "macos" }
"brew-cask:netnewswire" = { os = "macos" }
"brew-cask:obsidian" = { os = "macos" }
"brew-cask:proton-drive" = { os = "macos" }
"brew-cask:proton-mail" = { os = "macos" }
"brew-cask:proton-mail-bridge" = { os = "macos" }
"brew-cask:proton-meet" = { os = "macos" }
"brew-cask:proton-pass" = { os = "macos" }
"brew-cask:signal" = { os = "macos" }
"brew-cask:spotify" = { os = "macos" }
"brew-cask:tailscale-app" = { os = "macos" }
"brew-cask:visual-studio-code" = { os = "macos" }
"brew-cask:vivaldi" = { os = "macos" }
"brew-cask:whatcable" = { os = "macos" }
"mas:6502835663" = "latest"                         # Proton Pass for Safari
"mas:497799835" = "latest"                          # Xcode

[tasks."bootstrap:install:apps"]
description = "Install workstation apps"
run = [
  { tasks = [
    "bootstrap:install:claude",
    "bootstrap:install:codex",
    "bootstrap:install:copilot",
    "bootstrap:install:zed",
  ] },
]
[tasks."bootstrap:install:claude"]
description = "Install Claude Code CLI"
depends = [
  { task = "bootstrap:curl-install", args = [
    "claude",
    "https://claude.ai/install.sh",
    "bash",
  ] },
]

[tasks."bootstrap:install:codex"]
description = "Install Codex CLI"
depends = [
  { task = "bootstrap:curl-install", args = [
    "codex",
    "https://chatgpt.com/codex/install.sh",
  ], env = { CODEX_NON_INTERACTIVE = "true" } },
]

[tasks."bootstrap:install:copilot"]
description = "Install GitHub Copilot CLI"
depends = [
  { task = "bootstrap:curl-install", args = [
    "copilot",
    "https://gh.io/copilot-install",
    "bash",
  ] },
]

[tasks."bootstrap:install:zed"]
description = "Install Zed"
depends = [
  { task = "bootstrap:curl-install", args = [
    "zed",
    "https://zed.dev/install.sh",
  ] },
]

[tasks."bootstrap:fix-openai-rpm"]
description = "Fix OpenAI OpenPGP key"
hide = true
run = '''
[ "$(uname -s)" = "Linux" ] && gpg --enarmor < /etc/pki/rpm-gpg/RPM-GPG-KEY-chatgpt | sudo tee /etc/pki/rpm-gpg/RPM-GPG-KEY-chatgpt.asc >/dev/null
'''
