# Linux platform configuration

[shell_alias]
about = 'fastfetch'
battery = 'upower --battery'
pbcopy = 'wl-copy'
pbpaste = 'wl-paste'

[bootstrap.packages]
"dnf:git" = "latest"
"dnf:zsh" = "latest"
"apt:git" = "latest"
"apt:zsh" = "latest"
"pacman:git" = "latest"
"pacman:zsh" = "latest"
"apk:git" = "latest"
"apk:zsh" = "latest"

[bootstrap.hooks.pre-packages]
