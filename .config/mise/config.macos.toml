# macOS platform configuration

[shell_alias]
about = 'system_profiler SPHardwareDataType SPSoftwareDataType SPStorageDataType'
battery = 'pmset -g batt'
dequarantine = 'xattr -d com.apple.quarantine'
spotlight-rebuild = 'sudo mdutil -E /'
sysver = 'sw_vers'
protonmail-bridge = '"/Applications/Proton Mail Bridge.app/Contents/MacOS/Proton Mail Bridge"'
tailscale = '/Applications/Tailscale.app/Contents/MacOS/Tailscale'

[tools]
mas = "latest"

[bootstrap.macos.dock]
autohide = true
show_recents = true

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
preferred_view_style = "column"

[bootstrap.macos.keyboard]
press_and_hold = false

[bootstrap.macos.defaults]
"com.apple.finder" = { AppleShowAllFiles = true }
"com.apple.terminal" = { FocusFollowsMouse = true }
"NSGlobalDomain" = { "NSMenuEnableActionImages" = false }

[bootstrap.hooks.post-defaults]
run = ['killall Dock || true', 'killall Finder || true']

[bootstrap.hooks.pre-packages]
run = 'xcode-select --install || true'
