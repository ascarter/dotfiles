# Keep the global baseline deliberately small. rv provides the Ruby manager,
# and stable Rust provides a fallback; projects select their own toolchains.
[settings]
idiomatic_version_file_enable_tools = ["rust"]
python.uv_venv_auto = "source"

[tools]
"aqua:spinel-coop/rv" = "latest"
fzf = "latest"
gh = "latest"
git-lfs = "latest"
neovim = "latest"
rust = "stable"
tree-sitter = "latest"
usage = "latest"
